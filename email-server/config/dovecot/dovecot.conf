# =====================================================
# Dovecot Configuration
# =====================================================

# ── Protocols ─────────────────────────────────────────────
protocols = imap pop3 lmtp sieve

# ── Logging ───────────────────────────────────────────────
log_path = /dev/stderr
info_log_path = /dev/stdout
debug_log_path = /dev/stdout

# ── TLS ───────────────────────────────────────────────────
ssl = required
ssl_cert = </etc/letsencrypt/live/mail.example.com/fullchain.pem
ssl_key = </etc/letsencrypt/live/mail.example.com/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

# ── Authentication ────────────────────────────────────────
auth_mechanisms = plain login
disable_plaintext_auth = yes

passdb {
    driver = sql
    args = /etc/dovecot/sql/dovecot-sql.conf
}

userdb {
    driver = sql
    args = /etc/dovecot/sql/dovecot-sql.conf
}

# ── Auth service for Postfix SASL ────────────────────────
service auth {
    inet_listener {
        port = 12345
    }
}

# ── Mail Location & Namespace ────────────────────────────
mail_location = maildir:/var/mail/vhosts/%d/%n
mail_uid = 5000
mail_gid = 5000
mail_privileged_group = mail

first_valid_uid = 5000
last_valid_uid = 5000

namespace inbox {
    inbox = yes
    separator = /

    mailbox Drafts {
        auto = subscribe
        special_use = \Drafts
    }
    mailbox Sent {
        auto = subscribe
        special_use = \Sent
    }
    mailbox "Sent Messages" {
        special_use = \Sent
    }
    mailbox Trash {
        auto = subscribe
        special_use = \Trash
    }
    mailbox Junk {
        auto = subscribe
        special_use = \Junk
    }
    mailbox Archive {
        auto = subscribe
        special_use = \Archive
    }
}

# ── LMTP (receives mail from Postfix) ───────────────────
service lmtp {
    inet_listener lmtp {
        port = 24
    }
}

# ── IMAP ─────────────────────────────────────────────────
protocol imap {
    mail_max_userip_connections = 20
    imap_idle_notify_interval = 2 mins
}

# ── POP3 ─────────────────────────────────────────────────
protocol pop3 {
    pop3_uidl_format = %08Xu%08Xv
}

# ── Sieve ────────────────────────────────────────────────
protocol sieve {
    managesieve_logout_format = bytes ( in=%i : out=%o )
}

plugin {
    sieve = file:~/sieve;active=~/.dovecot.sieve
    sieve_default = /var/mail/vhosts/default.sieve
}

# ── Quota ────────────────────────────────────────────────
plugin {
    quota = maildir:User quota
    quota_rule = *:storage=1G
    quota_grace = 10%%
    quota_status_success = DUNNO
    quota_status_nouser = DUNNO
    quota_status_overquota = "552 5.2.2 Mailbox is full"
}

protocol imap {
    mail_plugins = $mail_plugins quota imap_quota
}

protocol lmtp {
    mail_plugins = $mail_plugins quota sieve
}

# ── Listener Config ──────────────────────────────────────
service imap-login {
    inet_listener imaps {
        port = 993
        ssl = yes
    }
    # Disable plaintext IMAP on port 143
    inet_listener imap {
        port = 0
    }
}

service pop3-login {
    inet_listener pop3s {
        port = 995
        ssl = yes
    }
    inet_listener pop3 {
        port = 0
    }
}

service managesieve-login {
    inet_listener sieve {
        port = 4190
    }
}
