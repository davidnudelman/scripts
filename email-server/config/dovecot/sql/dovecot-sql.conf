driver = pgsql
connect = host=postgres dbname=mailserver user=mailuser password=changeme

default_pass_scheme = BLF-CRYPT

password_query = \
    SELECT email AS user, password \
    FROM users \
    WHERE email = '%u' AND active = TRUE

user_query = \
    SELECT \
        '/var/mail/vhosts/%d/%n' AS home, \
        5000 AS uid, \
        5000 AS gid, \
        CONCAT('*:bytes=', quota) AS quota_rule \
    FROM users \
    JOIN domains ON users.domain_id = domains.id \
    WHERE users.email = '%u' AND users.active = TRUE AND domains.active = TRUE

iterate_query = \
    SELECT email AS user FROM users WHERE active = TRUE
