# DKIM signing configuration
# Keys are managed via the admin web UI and stored in /var/lib/rspamd/dkim/

enabled = true;

sign_authenticated = true;
sign_local = true;

use_domain = "header";
use_redis = false;
use_esld = true;

# Key path pattern: /var/lib/rspamd/dkim/<domain>/<selector>.key
path = "/var/lib/rspamd/dkim/$domain/$selector.key";
selector = "mail";

# Allow signing for all domains with keys present
allow_username_mismatch = true;

# Check all domains
check_pubkey = false;
